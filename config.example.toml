[database]
# 新 profile 由 `mem012 --create_profile <profile>` 创建并追加到这里。

[categories]
index_list = ["init", "core", "user", "agent", "project", "github", "ops", "book"]

[embeddings]
# 填写实际可用的 embedding API base URL 或完整 endpoint。
embeddings_api = "local"
embeddings_api_type = "embeddings"
embeddings_model = "BAAI/bge-m3"
embeddings_dimension = 1024
# 向量召回允许的最大余弦距离，超过即过滤。更换模型后需重新标定。
embeddings_fallback_max_distance = 0.47
embeddings_key = "" # API 无需鉴权时可为空。

[rerank]
rerank_min_score = 0.4 # rerank 相关性分数下限，按 provider 返回的分数标定。
enabled = false # 配置可用的 rerank API 后可设为 true。
rerank_api = "local" # 填写实际可用的 rerank API base URL 或完整 endpoint。
rerank_api_type = "rerank"
rerank_model = "BAAI/bge-reranker-v2-m3" # 当前已冻结实际 tokenizer 和 8192 token 窗口的模型。
rerank_key = "" # 使用远程 rerank API 时填写。

[network]
enable_proxy = false # true 时才使用下面的 proxy。
proxy = "socks5://127.0.0.1:12828" # 可选；也支持 "http://127.0.0.1:12828"。

[debug]
# true 会在 create_memory 写入前清空目标 profile 记忆表并重新建表，只能在本地调试打开。
reset_db = false

[cleanup]
trash_retention_minutes = 10080 # 进入回收站后保留 7 天，超时由 server 后台任务永久删除。
sweep_interval_minutes = 30 # server 后台扫描到期回收站项目的间隔。

[server]
addr = "0.0.0.0:37777" # host
api_token = "xxx" # web login password
# 本机前有一层会覆盖/追加 X-Forwarded-For 的可信反代时使用 1；公网直连仍使用 TCP 对端地址。
trusted_proxy_hops = 1

[client]
# CLI/Agent 调用 HTTP API 时使用的外部可访问地址。
# 不填或留空时使用 server.addr；例如 0.0.0.0:37777 会转换为 http://127.0.0.1:37777。
base_url = "https://xxx.com"
